<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gwent — Assistente de Pontuação</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
<header class="topbar"><div><div class="eyebrow">GWENT</div><h1>Assistente de pontuação</h1></div><button class="reset-btn" id="resetBtn">↻</button></header>
<section class="score-panel">
<div class="score"><span class="label">PONTUAÇÃO</span><strong id="totalScore">0</strong></div>
<div class="round-info"><button class="gem active" data-gem="0">◆</button><button class="gem active" data-gem="1">◆</button></div>
<div class="specials"><button class="special" id="weatherBtn">🌦️</button><button class="special" id="leaderBtn">👑</button></div>
</section>
<section class="board" id="board"></section>
<section class="add-area"><div class="section-title">ADICIONAR CARTA</div>
<div class="number-pad">
<button data-add="1">1</button><button data-add="2">2</button><button data-add="3">3</button><button data-add="4">4</button><button data-add="5">5</button>
<button data-add="6">6</button><button data-add="7">7</button><button data-add="8">8</button><button data-add="9">9</button><button data-add="10">10</button>
<button data-add="11">11</button><button data-add="12">12</button><button data-add="13">13</button><button data-add="14">14</button><button data-add="15">15</button>
</div><p class="hint">Selecione a fileira e toque em um valor para adicionar a carta.</p></section>
</main>

<div class="modal hidden" id="cardModal"><div class="modal-card"><button class="close">×</button>
<div class="modal-number" id="modalNumber">6</div><div class="modal-title">Tipo da carta</div>
<div class="effect-grid">
<button class="effect-btn" data-effect="bond">🔗<span>Laço Forte</span></button>
<button class="effect-btn" data-effect="bondPlus">🔒<span>Laço Forte +1</span></button>
<button class="effect-btn" data-effect="morale">❤️<span>Moral</span></button>
<button class="effect-btn" data-effect="hero">👑<span>Herói</span></button>
</div><button class="delete-btn" id="deleteCard">Excluir carta</button></div></div>

<div class="modal hidden" id="weatherModal"><div class="modal-card"><button class="close">×</button><div class="modal-title">Clima</div>
<div class="weather-grid">
<button data-weather="none">☀️<span>Dia Limpo</span></button><button data-weather="frost">❄️<span>Geada</span></button>
<button data-weather="fog">🌫️<span>Névoa</span></button><button data-weather="rain">🌧️<span>Chuva</span></button><button data-weather="storm">⛈️<span>Tempestade</span></button>
</div></div></div>

<div class="modal hidden" id="leaderModal"><div class="modal-card"><button class="close">×</button><div class="modal-title">Efeito do líder</div>
<div class="leader-options"><button data-leader="none">Nenhum</button><button data-leader="horn">🎺 Multiplicar fileira</button></div></div></div>
<script src="script.js"></script>
</body></html>
